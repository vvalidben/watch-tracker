    <line x1="128" y1="84" x2="160" y2="48" stroke="#07050d" stroke-width="10" stroke-linecap="round"/>
    <circle cx="92" cy="44" r="10" fill="#ff4f9a" stroke="#07050d" stroke-width="6"/>

    <!-- Set, with its hard shadow -->
    <rect x="46" y="92" width="176" height="128" rx="28" fill="#07050d"/>
    <rect x="36" y="82" width="176" height="128" rx="28" fill="#ff4f9a" stroke="#07050d" stroke-width="9"/>
    <rect x="56" y="100" width="136" height="92" rx="14" fill="#0e0b1a"/>
    <path d="M60 106 L96 106 L68 186 L60 186 Z" fill="#ffffff" opacity="0.1"/>

