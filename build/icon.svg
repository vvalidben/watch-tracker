    <path d="M128 140 L116 -220 L140 -220 Z" fill="#ffffff" opacity="0.38" transform="rotate(90 128 140)"/>
    <path d="M128 140 L116 -220 L140 -220 Z" fill="#ffffff" opacity="0.38" transform="rotate(112.5 128 140)"/>
    <path d="M128 140 L116 -220 L140 -220 Z" fill="#ffffff" opacity="0.38" transform="rotate(135 128 140)"/>
    <path d="M128 140 L116 -220 L140 -220 Z" fill="#ffffff" opacity="0.38" transform="rotate(157.5 128 140)"/>
    <path d="M128 140 L116 -220 L140 -220 Z" fill="#ffffff" opacity="0.38" transform="rotate(180 128 140)"/>
    <path d="M128 140 L116 -220 L140 -220 Z" fill="#ffffff" opacity="0.38" transform="rotate(202.5 128 140)"/>
    <path d="M128 140 L116 -220 L140 -220 Z" fill="#ffffff" opacity="0.38" transform="rotate(225 128 140)"/>
    <path d="M128 140 L116 -220 L140 -220 Z" fill="#ffffff" opacity="0.38" transform="rotate(247.5 128 140)"/>
    <path d="M128 140 L116 -220 L140 -220 Z" fill="#ffffff" opacity="0.38" transform="rotate(270 128 140)"/>
    <path d="M128 140 L116 -220 L140 -220 Z" fill="#ffffff" opacity="0.38" transform="rotate(292.5 128 140)"/>
    <path d="M128 140 L116 -220 L140 -220 Z" fill="#ffffff" opacity="0.38" transform="rotate(315 128 140)"/>
    <path d="M128 140 L116 -220 L140 -220 Z" fill="#ffffff" opacity="0.38" transform="rotate(337.5 128 140)"/>

    <!-- Halftone band and sparkle -->
    <rect y="196" width="256" height="60" fill="url(#dotA)" opacity="0.16"/>
    <path d="M206 26 Q210 46 230 50 Q210 54 206 74 Q202 54 182 50 Q202 46 206 26Z" fill="#ffffff" stroke="#07050d" stroke-width="4" stroke-linejoin="round"/>

